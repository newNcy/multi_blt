<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Dual Blt</title>
<style>
  :root {
    --bg: #070808;
    --card: #17191B;
    --card-hi: #212428;
    --border: #313131;
    --lime: #D0FF00;
    --green: #2BC235;
    --red: #FF4A55;
    --gray: #A0A3A7;
    --text: #EDEDEF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }

  /* 顶栏 */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header .logo { font-size: 17px; font-weight: 700; color: var(--lime); letter-spacing: .5px; }
  header .sub { color: var(--gray); font-size: 11px; }
  header .spacer { flex: 1; }

  /* 状态徽章（flap 涨跌胶囊风格：方角满色） */
  .badge {
    display: inline-flex; align-items: center;
    height: 26px; padding: 0 12px;
    font-size: 12px; font-weight: 600;
    background: var(--card); color: var(--gray);
  }
  .badge.streaming { background: var(--green); color: #fff; }
  .badge.busy      { background: var(--lime);  color: #070808; }
  .badge.failed    { background: var(--red);   color: #fff; }

  /* 控制区 */
  .controls { padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { width: 62px; text-align: right; color: var(--gray); flex: none; }
  select {
    flex: none; width: 300px; height: 32px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); outline: none;
    font: inherit; padding: 0 8px;
  }
  select:hover, select:focus { border-color: var(--lime); }
  option { background: var(--card); color: var(--text); }
  button {
    height: 32px; padding: 0 14px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--border); outline: none;
    font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--lime); color: var(--lime); }
  button:active { background: var(--card-hi); }
  button.primary { background: var(--lime); color: #070808; border-color: var(--lime); font-weight: 600; }
  button.primary:hover { background: #E4FF4D; color: #070808; }
  button.primary:active { background: #B8D900; }
  button:disabled { opacity: .35; cursor: default; pointer-events: none; }

  input[type=range] {
    flex: 1; height: 32px; accent-color: var(--lime); background: transparent;
  }
  input[type=checkbox] { accent-color: var(--lime); width: 15px; height: 15px; }
  .volval { width: 44px; text-align: right; font-family: Consolas, monospace; color: var(--gray); }

  /* 设备列表 */
  .devhead {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 6px; color: var(--gray); font-size: 12px;
  }
  .devlist { flex: 1; overflow-y: auto; padding: 0 16px; }
  .devlist::-webkit-scrollbar { width: 8px; }
  .devlist::-webkit-scrollbar-thumb { background: var(--border); }
  .devlist::-webkit-scrollbar-thumb:hover { background: #484B51; }
  .dev {
    display: flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 12px; margin-bottom: 6px;
    background: var(--card); border: 1px solid transparent;
    cursor: default;
  }
  .dev:hover { background: var(--card-hi); border-color: var(--border); }
  .dev.streaming { border-color: var(--green); }
  .dev svg { flex: none; }
  .dev .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .addr { color: var(--gray); font-size: 11px; }
  .dev .st { flex: none; width: 90px; text-align: right; color: var(--gray); }
  .dev .st.on { color: var(--green); font-weight: 600; }
  .empty { color: var(--gray); padding: 18px 4px; font-size: 12px; }

  /* 底部状态条 */
  footer { padding: 10px 16px 12px; border-top: 1px solid var(--border); }
  footer .main { font-weight: 600; }
  footer .main.streaming { color: var(--green); }
  footer .main.busy { color: var(--lime); }
  footer .main.failed { color: var(--red); }
  footer .detail { color: var(--gray); font-size: 12px; margin-top: 2px; white-space: pre-wrap; }

  /* 右键菜单 */
  #ctx {
    position: fixed; z-index: 99; display: none; min-width: 150px;
    background: #111; border: 1px solid var(--border);
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #ctx div { padding: 8px 14px; cursor: pointer; }
  #ctx div:hover { background: var(--card-hi); color: var(--lime); }
  #ctx div.dis { opacity: .35; pointer-events: none; }
  #ctx hr { border: none; border-top: 1px solid var(--border); }
</style>
</head>
<body>
  <header>
    <span class="logo">Dual Blt</span>
    <span class="sub mono" id="versub">A2DP 推流</span>
    <span class="spacer"></span>
    <span class="badge" id="badge">待机</span>
  </header>

  <div class="controls">
    <div class="row">
      <label>适配器</label>
      <select id="adap"></select>
      <button id="btnScan" class="primary">扫描</button>
      <button id="btnRefresh">刷新</button>
      <button id="btnDriver">切换驱动</button>
    </div>
    <div class="row">
      <label>声音来源</label>
      <select id="src"></select>
      <button id="btnCopy" class="primary">开始复制声音</button>
      <button id="btnTone">测试音</button>
    </div>
    <div class="row">
      <label>推流音量</label>
      <input type="range" id="vol" min="0" max="100" value="100">
      <span class="volval" id="volval">100%</span>
      <label style="width:auto"><input type="checkbox" id="mute"> 静音</label>
    </div>
  </div>

  <div class="devhead">设备 <span style="color:#484B51">|</span> <span style="font-size:11px">右键操作：连接并推流 / 配对 / 断开 / 忘记</span></div>
  <div class="devlist" id="devs"></div>

  <footer>
    <div class="main" id="status">【待机】点「扫描」查找设备</div>
    <div class="detail" id="detail"></div>
  </footer>

  <div id="ctx"></div>

<script>
const $ = id => document.getElementById(id);
const post = s => chrome.webview ? chrome.webview.postMessage(s) : console.log(s);

// 耳机 / 音箱 图标（flap 荧光黄绿）
const svgHeadphone = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 12a7 7 0 0 1 14 0" stroke="#D0FF00" stroke-width="1.8" stroke-linecap="round"/><rect x="2.6" y="11.4" width="3.4" height="6.2" rx="1.2" fill="#D0FF00"/><rect x="14" y="11.4" width="3.4" height="6.2" rx="1.2" fill="#D0FF00"/></svg>';
const svgSpeaker = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 8v4l4 3.5v-11L4 8z" fill="#D0FF00"/><rect x="8.4" y="7" width="2" height="6" fill="#D0FF00"/><path d="M12.6 6.2a5 5 0 0 1 0 7.6" stroke="#D0FF00" stroke-width="1.6" stroke-linecap="round"/></svg>';

let S = null;
let ctxAddr = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function applyState(s) {
  S = s;
  // 适配器下拉
  const ad = $('adap');
  ad.innerHTML = (s.adapters || []).map((a, i) =>
    `<option value="${i}">${esc(a.name)} (${a.vid}:${a.pid}) — ${a.winusb ? '可用' : '被系统占用'}</option>`).join('');
  ad.selectedIndex = s.adapterSel ?? 0;
  $('btnDriver').disabled = !(s.adapters && s.adapters[s.adapterSel] && !s.adapters[s.adapterSel].winusb);

  // 声音来源下拉
  const src = $('src');
  src.innerHTML = (s.srcs || []).map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('');
  src.selectedIndex = s.srcSel ?? 0;

  // 音量
  if (document.activeElement !== $('vol')) $('vol').value = s.vol ?? 100;
  $('volval').textContent = Math.round(s.vol ?? 100) + '%';
  $('mute').checked = !!s.mute;

  // 按钮
  const scanning = s.phase === 1;
  $('btnScan').textContent = scanning ? '停止扫描' : '扫描';
  $('btnScan').classList.toggle('primary', !scanning);
  const capOn = s.capOn;
  $('btnCopy').textContent = capOn ? '停止复制声音' : '开始复制声音';
  $('btnCopy').classList.toggle('primary', !capOn);
  $('btnTone').style.color = s.testTone ? 'var(--lime)' : '';

  // 设备列表
  const list = $('devs');
  if (!s.devs || !s.devs.length) {
    list.innerHTML = '<div class="empty">列表为空：点「扫描」发现新设备（已配对设备启动时自动载入）</div>';
  } else {
    list.innerHTML = s.devs.map(d => `
      <div class="dev ${d.streaming ? 'streaming' : ''}" data-addr="${esc(d.addr)}">
        ${d.hp ? svgHeadphone : svgSpeaker}
        <div class="name">${esc(d.name)} <span class="addr mono">${esc(d.addr)}</span></div>
        <div class="st ${d.streaming ? 'on' : ''}">${esc(d.status)}</div>
      </div>`).join('');
  }

  // 顶栏徽章 + 底部状态
  const b = $('badge'), st = $('status');
  let cls = '', txt = '待机';
  switch (s.phase) {
    case 1: cls = 'busy';      txt = '扫描中'; break;
    case 2: cls = 'busy';      txt = '连接中'; break;
    case 3: cls = 'streaming'; txt = '推流中'; break;
    case 4: cls = 'failed';    txt = '失败';   break;
  }
  b.className = 'badge ' + cls; b.textContent = txt;
  st.textContent = s.status || '';
  st.className = 'main ' + cls;
  $('detail').textContent = s.detail || '';
}

// ---- 事件 ----
$('btnScan').onclick = () => post('c=scan');
$('btnRefresh').onclick = () => post('c=refresh');
$('btnDriver').onclick = () => post('c=driver&i=' + (S ? S.adapterSel : 0));
$('adap').onchange = () => post('c=adap&i=' + $('adap').selectedIndex);
$('src').onchange = () => post('c=src&i=' + $('src').selectedIndex);
$('btnCopy').onclick = () => post('c=copy');
$('btnTone').onclick = () => post('c=tone');
$('vol').oninput = () => {
  $('volval').textContent = $('vol').value + '%';
  post('c=vol&v=' + ($('vol').value / 100).toFixed(3));
};
$('mute').onchange = () => post('c=mute&v=' + ($('mute').checked ? 1 : 0));

// 设备右键菜单
const ctx = $('ctx');
document.addEventListener('click', () => ctx.style.display = 'none');
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('.dev');
  if (!row) { ctx.style.display = 'none'; return; }
  e.preventDefault();
  ctxAddr = row.dataset.addr;
  const d = S && S.devs ? S.devs.find(x => x.addr === ctxAddr) : null;
  const canDisc = d && d.cur && S.phase === 3;
  ctx.innerHTML = `
    <div data-c="connect">连接并推流</div>
    <div data-c="pair">配对</div>
    <div data-c="tone">测试音开关</div>
    <hr>
    <div data-c="disconnect" class="${canDisc ? '' : 'dis'}">断开</div>
    <div data-c="forget">忘记设备</div>`;
  ctx.style.display = 'block';
  const mw = ctx.offsetWidth, mh = ctx.offsetHeight;
  ctx.style.left = Math.min(e.clientX, innerWidth - mw - 4) + 'px';
  ctx.style.top = Math.min(e.clientY, innerHeight - mh - 4) + 'px';
});
ctx.addEventListener('click', e => {
  const c = e.target.dataset.c;
  if (!c) return;
  ctx.style.display = 'none';
  if (c === 'disconnect' || c === 'tone') post('c=' + c);
  else post('c=' + c + '&addr=' + encodeURIComponent(ctxAddr));
});
// 双击 = 连接
$('devs').addEventListener('dblclick', e => {
  const row = e.target.closest('.dev');
  if (row) post('c=connect&addr=' + encodeURIComponent(row.dataset.addr));
});

chrome.webview.addEventListener('message', e => { if (typeof e.data === 'object' && e.data) applyState(e.data); });
</script>
</body>
</html>
